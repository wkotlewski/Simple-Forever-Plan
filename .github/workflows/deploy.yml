name: Deploy to GitHub Pages

# GitHub Pages serves this repo's main branch. On every push, this builds the app and commits
# the result into the app/ folder, so it is live at https://<owner>.github.io/<repo>/app/
# (the main link forwards there).
on:
  push:
    branches: [main]
    paths-ignore: ['app/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/app/
          # Settings like the Supabase project and Google client ID live in .env.production.
      - name: Commit the built app to app/
        run: |
          rm -rf app && mv dist app
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app
          git diff --cached --quiet && exit 0
          git commit -q -m "Publish app build ${GITHUB_SHA::7} [skip ci]"
          git push
